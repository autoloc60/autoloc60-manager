<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoLoc60 Manager</title>
<style>
 :root{--red:#d71920;--dark:#101317;--muted:#667085;--bg:#edf2f7;--card:#ffffffd9}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;color:#171a1f;background:linear-gradient(135deg,#e8eef5 0%,#f8fafc 48%,#dfe8f1 100%);background-attachment:fixed}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{display:flex;min-height:100vh}.sidebar{width:245px;background:linear-gradient(180deg,#0b1623f5,#172738f2);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;box-shadow:5px 0 25px #0b162326}
.logo{width:100%;max-height:110px;object-fit:contain;background:#fff;border-radius:10px;margin-bottom:18px}
.nav button{display:block;width:100%;text-align:left;padding:13px 12px;border:1px solid #ffffff12;background:linear-gradient(135deg,#ffffff12,#ffffff04);color:#e8eaed;border-radius:11px;margin:7px 0;box-shadow:inset 0 1px #ffffff0a;transition:.2s}
.nav button.active,.nav button:hover{background:linear-gradient(135deg,#ed1c24,#a80e15);color:#fff;transform:translateX(2px)}
.main{flex:1;padding:24px;max-width:1600px;margin:auto;background:radial-gradient(circle at 85% 8%,#ffffffa8 0 12%,transparent 35%)}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}
h1{margin:0;font-size:28px}.sub{color:var(--muted);margin:5px 0 20px}.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:8px;padding:10px 14px;background:var(--red);color:#fff;font-weight:700}.btn.secondary{background:#ffffffc9;color:#20252b;border:1px solid #cbd5e1}.btn.dark{background:var(--dark)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:15px}.card{background:linear-gradient(135deg,#ffffffed,#eaf1f8d9);border:1px solid #ffffffb8;border-radius:16px;padding:18px;box-shadow:0 8px 25px #24344718;backdrop-filter:blur(7px)}.grid>.card:nth-child(2){background:linear-gradient(135deg,#effcf5ed,#d9f3e6d9)}.grid>.card:nth-child(3){background:linear-gradient(135deg,#f4f0ffed,#e8ddffd9)}.grid>.card:nth-child(4){background:linear-gradient(135deg,#fff8e9ed,#ffedcbd9)}.metric strong{font-size:30px;display:block;margin:8px 0}.muted{color:var(--muted);font-size:14px}
.section{margin-top:18px}.section h2{font-size:20px;margin:0 0 12px}.tablewrap{overflow:auto;background:linear-gradient(135deg,#ffffffd9,#e7eef7cc)}.table{width:100%;border-collapse:separate;border-spacing:0 8px}.table th,.table td{text-align:left;padding:13px;border-bottom:0;white-space:nowrap}.table th{color:#334155}.table tr:not(:first-child) td{background:#ffffffd9;border-top:1px solid #ffffffb8;border-bottom:1px solid #dbe4ee}.table tr:not(:first-child) td:first-child{border-radius:11px 0 0 11px}.table tr:not(:first-child) td:last-child{border-radius:0 11px 11px 0}.badge{padding:5px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#e8f7ed;color:#16733a}.badge.red{background:#ffe7e8;color:#a51018}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #d8dee6;border-radius:8px;background:#fff}.field textarea{min-height:90px}
.hidden{display:none}.photo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.photo-slot{border:2px dashed #cbd3dc;border-radius:10px;padding:10px;text-align:center;background:#fafbfc}.photo-slot img{width:100%;height:105px;object-fit:cover;border-radius:7px;margin-top:8px}
.notice{padding:12px;border-left:4px solid var(--red);background:#fff3f3;border-radius:8px;margin:12px 0}.signature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.signature-box{border:1px solid #d8dee6;border-radius:10px;padding:10px}.signature-box canvas{width:100%;height:150px;border:1px dashed #aab4c0;border-radius:7px;background:#fff;touch-action:none}.signature-box button{margin-top:7px}
@media(max-width:800px){.app{display:block}.sidebar{width:100%;height:auto;position:static}.logo{height:85px}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.nav button{font-size:12px;padding:9px}.main{padding:15px}h1{font-size:23px}}

/* V7 - fonds visibles pour chaque élément */
body{background:linear-gradient(135deg,#dbeafe 0%,#f8fafc 45%,#fee2e2 100%) !important;background-attachment:fixed !important;}
.sidebar{background:linear-gradient(180deg,#111827 0%,#7f1d1d 100%) !important;}
.nav button{background:linear-gradient(135deg,rgba(255,255,255,.20),rgba(255,255,255,.06)) !important;border:1px solid rgba(255,255,255,.25) !important;}
.main{background:radial-gradient(circle at 90% 0%,rgba(255,255,255,.95),rgba(255,255,255,.35) 42%,transparent 70%) !important;}
.card{background:linear-gradient(135deg,#ffffff 0%,#dbeafe 100%) !important;border:2px solid #bfdbfe !important;box-shadow:0 8px 22px rgba(30,64,175,.16) !important;}
.grid>.card:nth-child(2){background:linear-gradient(135deg,#ffffff 0%,#bbf7d0 100%) !important;border-color:#86efac !important;}
.grid>.card:nth-child(3){background:linear-gradient(135deg,#ffffff 0%,#ddd6fe 100%) !important;border-color:#c4b5fd !important;}
.grid>.card:nth-child(4){background:linear-gradient(135deg,#ffffff 0%,#fde68a 100%) !important;border-color:#fcd34d !important;}
.tablewrap{background:linear-gradient(135deg,#ffffff 0%,#e0f2fe 100%) !important;border:2px solid #bae6fd !important;}
.table tr:not(:first-child) td{background:linear-gradient(135deg,#ffffff 0%,#f1f5f9 100%) !important;border-top:1px solid #cbd5e1 !important;border-bottom:1px solid #cbd5e1 !important;}
.formgrid,.photo-grid,.signature-grid{background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(224,242,254,.85));padding:14px;border-radius:14px;border:2px solid #bae6fd;}
.field,.photo-slot,.signature-box{background:linear-gradient(135deg,#ffffff,#fef3c7);padding:12px;border-radius:12px;border:1px solid #fde68a;}
.section{background:transparent !important;}
.notice{background:linear-gradient(135deg,#fff1f2,#fecdd3) !important;}

</style>
<style id="autoloc60-background-fix">
html, body { min-height: 100%; }
body {
  background-color: #0b1623 !important;
  background-image: linear-gradient(rgba(8,18,32,.20), rgba(8,18,32,.20)), url("fond-auto-v10.png") !important;
  background-size: cover !important;
  background-position: center center !important;
  background-repeat: no-repeat !important;
  background-attachment: fixed !important;
}
.app { background: transparent !important; }
.main { background: rgba(255,255,255,.10) !important; }
</style>
<style id="autoloc60-final-background-fix">
html, body { min-height: 100%; }
body {
  position: relative;
  overflow-x: hidden;
  background: #0b1623 !important;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background-image: linear-gradient(rgba(8,18,32,.12), rgba(8,18,32,.12)), url("fond-auto-v10.png");
  background-repeat: no-repeat;
  background-position: center center;
  background-size: cover;
}
.app { position: relative; z-index: 0; background: transparent !important; }
</style>

<style id="autoloc60-v11-background-final">
/* V11 : fond entier visible, sans étirement ni recadrage */
html, body { min-height: 100%; }
body {
  position: relative;
  overflow-x: hidden;
  background: #0b1623 !important;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-color: #0b1623;
  background-image: linear-gradient(rgba(8,18,32,.08), rgba(8,18,32,.08)), url("fond-auto-v10.png");
  background-repeat: no-repeat;
  background-position: center center;
  background-size: contain;
}
.app { position: relative; z-index: 1; background: transparent !important; }
</style>

<style id="autoloc60-v12-final-fix">
/* V12 : affichage de l'image complète, sans étirement ni recadrage */
html, body { min-height: 100%; }
body {
  margin: 0 !important;
  background-color: #0b1623 !important;
  background-image: none !important;
  position: relative;
  overflow-x: hidden;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-color: #0b1623;
  background-image: url("fond-auto-v10.png");
  background-repeat: no-repeat;
  background-position: center center;
  /* L'image garde exactement ses proportions : elle n'est ni étirée ni coupée. */
  background-size: auto 100vh;
}
.app { position: relative !important; z-index: 1 !important; background: transparent !important; }
.main { background: rgba(255,255,255,.06) !important; }
</style>

<style id="autoloc60-modele-2-transparent">
/* Modèle 2 : fond visible et blocs du tableau de bord transparents */
.main { background: transparent !important; }
#content > .grid:first-child > .card,
#content > .section.grid > .card {
  background: rgba(8, 18, 32, .22) !important;
  border: 1px solid rgba(255,255,255,.18) !important;
  box-shadow: none !important;
  backdrop-filter: none !important;
  color: #fff !important;
}
#content > .grid:first-child .muted,
#content > .section.grid .muted { color: rgba(255,255,255,.78) !important; }
#content > .section.grid { background: transparent !important; }
#content > .section.grid h2 { color: #fff !important; }
#content > .section.grid p { color: #fff !important; }
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<img class="logo" src="logo.png" alt="AutoLoc60">
<nav class="nav" id="nav">
<button data-page="dashboard" class="active">🏠 Tableau de bord</button>
<button data-page="vehicles">🚘 Véhicules</button>
<button data-page="rentals">📅 Locations</button>
<button data-page="clients">👥 Clients</button>
<button data-page="inspections">📸 États des lieux</button>
<button data-page="contracts">📄 Contrats</button>
<button data-page="deposits">💳 Cautions</button>
</nav>
</aside>
<main class="main">
<div class="top"><div><h1 id="title">AutoLoc60 Manager</h1><div class="sub">Gestion privée — administrateur et salarié</div></div><div class="actions"><button class="btn" onclick="quickInspection()">📸 Nouvel état des lieux</button><button class="btn secondary" onclick="exportData()">Exporter les données</button></div></div>
<section id="content"></section>
</main>
</div>
<script>
const $=s=>document.querySelector(s);
const state=JSON.parse(localStorage.getItem('autoloc60')||'null')||{
vehicles:[{id:1,name:'Peugeot 208',plate:'AB-123-CD',km:52450,status:'Disponible'},{id:2,name:'Renault Clio',plate:'EF-456-GH',km:68120,status:'Disponible'},{id:3,name:'Citroën C3',plate:'IJ-789-KL',km:41300,status:'Disponible'}],
clients:[],rentals:[],inspections:[],contracts:[],deposits:[]
};
function save(){localStorage.setItem('autoloc60',JSON.stringify(state))}
function page(p){$('#title').textContent={dashboard:'Tableau de bord',vehicles:'Véhicules',rentals:'Locations',clients:'Clients',inspections:'États des lieux',contracts:'Contrats',deposits:'Cautions'}[p];document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render(p)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>page(b.dataset.page));
function render(p='dashboard'){
if(p==='dashboard')return dashboard();
if(p==='vehicles')return vehicles();
if(p==='rentals')return rentals();
if(p==='clients')return clients();
if(p==='inspections')return inspections();
if(p==='contracts')return contracts();
if(p==='deposits')return deposits();
}
function dashboard(){
$('#content').innerHTML=`<div class="grid">
<div class="card metric">🚘 Véhicules<strong>${state.vehicles.length}</strong><span class="muted">Parc enregistré</span></div>
<div class="card metric">🔑 Locations en cours<strong>${state.rentals.filter(x=>x.status==='En cours').length}</strong><span class="muted">À surveiller</span></div>
<div class="card metric">📸 États des lieux<strong>${state.inspections.length}</strong><span class="muted">Départs et retours</span></div>
<div class="card metric">💳 Cautions<strong>${state.deposits.filter(x=>x.status!=='Restituée').length}</strong><span class="muted">À suivre</span></div>
</div>
<div class="section grid"><div class="card"><h2>Actions rapides</h2><div class="actions"><button class="btn" onclick="newRental()">+ Nouvelle location</button><button class="btn secondary" onclick="newClient()">+ Nouveau client</button><button class="btn secondary" onclick="quickInspection()">📸 État des lieux</button><button class="btn secondary" onclick="newContract()">📄 Contrat</button></div></div>
<div class="card"><h2>Dernières opérations</h2>${state.inspections.slice(-5).reverse().map(x=>`<p>📸 ${x.type} — ${x.vehicle||''} <span class="muted">${x.date||''}</span></p>`).join('')||'<p class="muted">Aucune opération pour le moment.</p>'}</div></div>`;
}
function vehicles(){
$('#content').innerHTML=`<div class="actions"><button class="btn" onclick="newVehicle()">+ Ajouter un véhicule</button></div><div class="section card tablewrap"><table class="table"><tr><th>Véhicule</th><th>Immatriculation</th><th>Kilométrage</th><th>Statut</th><th>Actions</th></tr>${state.vehicles.map((v,i)=>`<tr><td>${v.name}</td><td>${v.plate}</td><td>${v.km} km</td><td><span class="badge">${v.status}</span></td><td><button class="btn secondary" onclick="editVehicle(${i})">✏️ Modifier</button> <button class="btn secondary" onclick="deleteVehicle(${i})">🗑️ Supprimer</button></td></tr>`).join('')}</table></div>`;
}
function clients(){
$('#content').innerHTML=`<div class="actions"><button class="btn" onclick="newClient()">+ Ajouter un client</button></div><div class="section card tablewrap"><table class="table"><tr><th>Nom</th><th>Téléphone</th><th>E-mail</th></tr>${state.clients.map(c=>`<tr><td>${c.name}</td><td>${c.phone||''}</td><td>${c.email||''}</td></tr>`).join('')||'<tr><td colspan="3">Aucun client</td></tr>'}</table></div>`;
}
function rentals(){
$('#content').innerHTML=`<div class="actions"><button class="btn" onclick="newRental()">+ Nouvelle location</button></div><div class="section card tablewrap"><table class="table"><tr><th>Client</th><th>Véhicule</th><th>Départ</th><th>Retour</th><th>Statut</th></tr>${state.rentals.map(r=>`<tr><td>${r.client}</td><td>${r.vehicle}</td><td>${r.start}</td><td>${r.end}</td><td><span class="badge">${r.status}</span></td></tr>`).join('')||'<tr><td colspan="5">Aucune location</td></tr>'}</table></div>`;
}
function inspections(){
$('#content').innerHTML=`<div class="notice">Chaque état des lieux peut contenir des photos prises avec le téléphone, le kilométrage, le carburant, les dommages et les observations. Les données de cette version sont enregistrées dans le navigateur.</div><div class="actions"><button class="btn" onclick="quickInspection()">+ État des lieux départ/retour</button></div><div class="section card tablewrap"><table class="table"><tr><th>Type</th><th>Véhicule</th><th>Date</th><th>Photos</th><th>Observations</th><th>Actions</th></tr>${state.inspections.map((it,i)=>`<tr><td>${it.type}</td><td>${it.vehicle}</td><td>${it.date}</td><td>${it.photos?.length||0}</td><td>${it.notes||''}</td><td><button class="btn secondary" onclick="editInspection(${i})">✏️ Modifier</button> <button class="btn secondary" onclick="deleteInspection(${i})">🗑️ Supprimer</button></td></tr>`).join('')||'<tr><td colspan="6">Aucun état des lieux</td></tr>'}</table></div>`;
}
function contracts(){
$('#content').innerHTML=`<div class="notice">Les contrats peuvent être créés avec deux signatures dessinées à l'écran. Cette version permet ensuite d'imprimer/enregistrer le contrat en PDF via la fenêtre d'impression du téléphone ou de l'ordinateur.</div><div class="actions"><button class="btn" onclick="newContract()">+ Créer un contrat signé</button></div><div class="section card tablewrap"><table class="table"><tr><th>Client</th><th>Véhicule</th><th>Date</th><th>Montant</th><th>Actions</th></tr>${state.contracts.map((c,i)=>`<tr><td>${c.client}</td><td>${c.vehicle||c.model||''}</td><td>${c.date}</td><td>${c.amount||0} €</td><td><button class="btn secondary" onclick="editContract(${i})">✏️ Modifier</button> <button class="btn secondary" onclick="printContract(${i})">🖨️ PDF</button> <button class="btn secondary" onclick="deleteContract(${i})">🗑️ Supprimer</button></td></tr>`).join('')||'<tr><td colspan="5">Aucun contrat</td></tr>'}</table></div>`;
}
function deposits(){
$('#content').innerHTML=`<div class="actions"><button class="btn" onclick="newDeposit()">+ Ajouter une caution</button></div><div class="section card tablewrap"><table class="table"><tr><th>Client</th><th>Montant</th><th>Mode</th><th>Statut</th></tr>${state.deposits.map(d=>`<tr><td>${d.client}</td><td>${d.amount} €</td><td>${d.method}</td><td><span class="badge">${d.status}</span></td></tr>`).join('')||'<tr><td colspan="4">Aucune caution</td></tr>'}</table></div>`;
}
function modal(title,body,onSubmit){const wrap=document.createElement('div');wrap.style.cssText='position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:15px;z-index:10';wrap.innerHTML=`<div class="card" style="width:min(760px,100%);max-height:95vh;overflow:auto"><h2>${title}</h2>${body}<div class="actions" style="margin-top:15px"><button class="btn" id="ok">Enregistrer</button><button class="btn secondary" id="cancel">Annuler</button></div></div>`;document.body.append(wrap);$('#cancel').onclick=()=>wrap.remove();$('#ok').onclick=()=>{onSubmit(wrap);wrap.remove();save();render(document.querySelector('.nav button.active').dataset.page)}}
function newVehicle(){modal('Ajouter un véhicule',`<div class="formgrid"><div class="field"><label>Marque / modèle</label><input id="name"></div><div class="field"><label>Immatriculation</label><input id="plate"></div><div class="field"><label>Kilométrage</label><input id="km" type="number"></div><div class="field"><label>Statut</label><select id="status"><option>Disponible</option><option>En location</option><option>En maintenance</option></select></div></div>`,wrap=>state.vehicles.push({id:Date.now(),name:wrap.querySelector('#name').value,plate:wrap.querySelector('#plate').value,km:+wrap.querySelector('#km').value||0,status:wrap.querySelector('#status').value}))}
function editVehicle(i){const v=state.vehicles[i];if(!v)return;modal('Modifier le véhicule',`<div class="formgrid"><div class="field"><label>Marque / modèle</label><input id="name" value="${htmlAttr(v.name)}"></div><div class="field"><label>Immatriculation</label><input id="plate" value="${htmlAttr(v.plate)}"></div><div class="field"><label>Kilométrage</label><input id="km" type="number" value="${v.km||0}"></div><div class="field"><label>Statut</label><select id="status"><option>Disponible</option><option>En location</option><option>En maintenance</option></select></div></div>`,wrap=>{v.name=wrap.querySelector('#name').value;v.plate=wrap.querySelector('#plate').value;v.km=+wrap.querySelector('#km').value||0;v.status=wrap.querySelector('#status').value});setTimeout(()=>{const sel=document.querySelector('.card select#status');if(sel)sel.value=v.status},0)}
function deleteVehicle(i){if(!state.vehicles[i])return;if(confirm('Supprimer ce véhicule ?')){state.vehicles.splice(i,1);save();render('vehicles')}}
function htmlAttr(v){return String(v??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function newClient(){modal('Nouveau client',`<div class="formgrid"><div class="field"><label>Nom et prénom</label><input id="name"></div><div class="field"><label>Téléphone</label><input id="phone"></div><div class="field"><label>E-mail</label><input id="email" type="email"></div></div>`,()=>state.clients.push({name:$('#name').value,phone:$('#phone').value,email:$('#email').value}))}
function newRental(){modal('Nouvelle location',`<div class="formgrid"><div class="field"><label>Client</label><input id="client"></div><div class="field"><label>Véhicule</label><select id="vehicle">${state.vehicles.map(v=>`<option>${v.name}</option>`).join('')}</select></div><div class="field"><label>Départ</label><input id="start" type="datetime-local"></div><div class="field"><label>Retour</label><input id="end" type="datetime-local"></div></div>`,()=>state.rentals.push({client:$('#client').value,vehicle:$('#vehicle').value,start:$('#start').value,end:$('#end').value,status:'Prévue'}))}
function quickInspection(){modal('État des lieux départ / retour',`<div class="formgrid"><div class="field"><label>Type</label><select id="type"><option>Départ</option><option>Retour</option></select></div><div class="field"><label>Véhicule</label><select id="vehicle">${state.vehicles.map(v=>`<option>${v.name}</option>`).join('')}</select></div><div class="field"><label>Kilométrage</label><input id="km" type="number"></div><div class="field"><label>Carburant</label><select id="fuel"><option>Réservoir plein</option><option>3/4</option><option>1/2</option><option>1/4</option><option>Réserve</option></select></div><div class="field"><label>Lieu</label><input id="place"></div></div><div class="field"><label>Photos du véhicule (plusieurs possibles)</label><input id="photos" type="file" accept="image/*" multiple><div id="preview" class="photo-grid"></div></div><div class="field"><label>Observations / dommages</label><textarea id="notes"></textarea></div>`,wrap=>{const files=[...wrap.querySelector('#photos').files];const photos=files.map(f=>URL.createObjectURL(f));state.inspections.push({type:wrap.querySelector('#type').value,vehicle:wrap.querySelector('#vehicle').value,km:wrap.querySelector('#km').value,fuel:wrap.querySelector('#fuel').value,place:wrap.querySelector('#place').value,notes:wrap.querySelector('#notes').value,date:new Date().toLocaleString('fr-FR'),photos})})}
function newContract(editIndex=null){
const existing=editIndex===null?null:state.contracts[editIndex];
modal(editIndex===null?'Créer un contrat AutoLoc60 et signer':'Modifier le contrat AutoLoc60',`<div class="notice">Ce formulaire reprend la structure de ton contrat de base. Les champs peuvent être complétés avant l’impression ou l’enregistrement en PDF.</div>
<h3>Informations du locataire</h3><div class="formgrid">
<div class="field"><label>Nom et prénom</label><input id="client" required></div>
<div class="field"><label>Date de naissance</label><input id="birthDate" type="date"></div>
<div class="field"><label>Adresse</label><input id="address"></div>
<div class="field"><label>CP / Ville</label><input id="city"></div>
<div class="field"><label>E-mail</label><input id="email" type="email"></div>
<div class="field"><label>N° pièce d’identité</label><input id="idNo"></div>
<div class="field"><label>N° permis</label><input id="licenseNo"></div>
<div class="field"><label>Permis obtenu le</label><input id="licenseDate" type="date"></div>
